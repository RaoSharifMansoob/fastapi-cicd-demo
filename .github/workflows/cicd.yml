name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - cicd-implementation

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    services:
      postgresql:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Verify Poetry
        run: poetry --version

      - name: Install dependencies
        run: poetry install

      - name: Verify PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          pg_isready -h localhost -p 5432 -U postgres
          psql -h localhost -p 5432 -U postgres -d postgres \
            -c "SELECT version();"

      - name: Run database migrations
        env:
          APP_ENV: test
        run: poetry run alembic upgrade head

      - name: Verify database schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5432 -U postgres -d postgres \
            -c "\dt"

      - name: Run tests
        env:
          APP_ENV: test
        run: poetry run pytest -v -s

      - name: Run Ruff linting
        run: poetry run ruff check .

  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::949049116271:role/GitHubActionsECRPushRole
          aws-region: ap-south-1
          audience: sts.amazonaws.com

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          ECR_REGISTRY: 949049116271.dkr.ecr.ap-south-1.amazonaws.com
          ECR_REPOSITORY: fastapi-cicd-demo
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .

      - name: Push Docker image to Amazon ECR
        env:
          ECR_REGISTRY: 949049116271.dkr.ecr.ap-south-1.amazonaws.com
          ECR_REPOSITORY: fastapi-cicd-demo
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          
          # Notice we remove the single quotes from EOF so GitHub expands variables safely here
          ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=yes ubuntu@"$EC2_HOST" << EOF
            set -e
            
            # Explicitly define variables inside the execution block
            REGISTRY_ID="949049116271"
            AWS_REGION="ap-south-1"
            ECR_REGISTRY="\${REGISTRY_ID}.dkr.ecr.\${AWS_REGION}.amazonaws.com"
            ECR_REPOSITORY="fastapi-cicd-demo"
            IMAGE_TAG="${{ github.sha }}"

            echo "Logging in to Amazon ECR..."
            aws ecr get-login-password --region "\$AWS_REGION" | docker login --username AWS --password-stdin "\$ECR_REGISTRY"
            
            echo "Pulling Docker image..."
            docker pull "\$ECR_REGISTRY/\$ECR_REPOSITORY:\$IMAGE_TAG"
            
            echo "Stopping existing container..."
            docker rm -f fastapi-app 2>/dev/null || true
            
            echo "Starting new container..."
            docker run -d \
              --name fastapi-app \
              --restart unless-stopped \
              -p 8000:8000 \
              "\$ECR_REGISTRY/\$ECR_REPOSITORY:\$IMAGE_TAG"
            
            echo "Waiting for application startup..."
            for i in {1..10}; do
              # We escape the dollar signs (\$) here so they run on EC2, not the runner
              if docker ps --filter "name=fastapi-app" --filter "status=running" | grep -q "fastapi-app"; then
                echo "Container is running. Checking HTTP health..."
                if curl --fail --silent --show-error http://127.0.0 > /dev/null; then
                  echo "Deployment successful."
                  exit 0
                fi
              fi
              echo "App not ready yet, retrying in 2 seconds... (\$i/10)"
              sleep 2
            done

            echo "Error: Health check failed. Printing container logs:"
            docker logs fastapi-app
            exit 1
          EOF

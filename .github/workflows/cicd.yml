name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - cicd-implementation

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    services:
      postgresql:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Verify Poetry
        run: poetry --version

      - name: Install dependencies
        run: poetry install

      - name: Verify PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          pg_isready -h localhost -p 5432 -U postgres
          psql -h localhost -p 5432 -U postgres -d postgres \
            -c "SELECT version();"

      - name: Run database migrations
        env:
          APP_ENV: test
        run: poetry run alembic upgrade head

      - name: Verify database schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5432 -U postgres -d postgres \
            -c "\dt"

      - name: Run tests
        env:
          APP_ENV: test
        run: poetry run pytest -v -s

      - name: Run Ruff linting
        run: poetry run ruff check .

  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::949049116271:role/GitHubActionsECRPushRole
          aws-region: ap-south-1
          audience: sts.amazonaws.com

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          ECR_REGISTRY: 949049116271.dkr.ecr.ap-south-1.amazonaws.com
          ECR_REPOSITORY: fastapi-cicd-demo
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .

      - name: Push Docker image to Amazon ECR
        env:
          ECR_REGISTRY: 949049116271.dkr.ecr.ap-south-1.amazonaws.com
          ECR_REPOSITORY: fastapi-cicd-demo
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          IMAGE_TAG: ${{ github.sha }}
          ECR_REGISTRY: 949049116271.dkr.ecr.ap-south-1.amazonaws.com
          ECR_REPOSITORY: fastapi-cicd-demo
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            ubuntu@"$EC2_HOST" << EOF

            set -e

            echo "Logging in to Amazon ECR..."

            aws ecr get-login-password \
              --region ap-south-1 | \
              docker login \
              --username AWS \
              --password-stdin \
              $ECR_REGISTRY

            echo "Pulling Docker image..."

            docker pull \
              $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

            echo "Stopping existing container..."

            docker rm -f fastapi-app 2>/dev/null || true

            echo "Starting new container..."

            docker run -d \
              --name fastapi-app \
              --restart unless-stopped \
              -p 8000:8000 \
              $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

            echo "Waiting for application..."

            sleep 5

            echo "Checking container status..."

            docker ps --filter "name=fastapi-app"

            echo "Checking application health..."

            curl --fail \
              --silent \
              --show-error \
              http://localhost:8000/docs \
              > /dev/null

            echo "Deployment successful."

          EOF